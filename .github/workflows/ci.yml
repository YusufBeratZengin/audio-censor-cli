name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # One pin file for every job: a green run means the same tool versions.
  PIP_CONSTRAINT: requirements-dev.txt

jobs:
  # The project gate itself, on both supported operating systems.  This is the
  # job that mirrors `bash scripts/check.sh` for a contributor: Ruff (lint +
  # format), MyPy strict, pytest with the 85 % coverage floor.
  gate:
    name: gate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dev tools and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Show tool versions
        shell: bash
        run: |
          python --version
          python -m ruff --version
          python -m mypy --version
          ffmpeg -version | head -1

      - name: Run the project gate
        shell: bash
        run: bash scripts/check.sh

      # The Performance table in the README is generated by this script, so a
      # short run here keeps the documented command working and the video stream
      # guaranteed to stay a stream copy.
      - name: Benchmark smoke run (Linux)
        if: runner.os == 'Linux'
        run: python scripts/benchmark.py --quick

  # Supported Python versions, so a syntax or typing regression on the oldest
  # interpreter shows up before release.
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dev tools and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Tests with coverage
        run: python -m pytest tests/ --cov=audio_censor --cov-report=term-missing --cov-fail-under=85

      - name: End-to-end demo (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash examples/build_demo.sh demo-out
