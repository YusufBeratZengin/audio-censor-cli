[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "audio-censor-cli"
version = "0.1.0"
description = "Automated audio/video profanity and sensitive word bleeper and muter using timestamped transcripts and FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yusuf Berat Zengin", email = "118852217+YusufBeratZengin@users.noreply.github.com" }]
keywords = [
  "ffmpeg",
  "censorship",
  "audio-processing",
  "bleep",
  "profanity-filter",
  "subtitles",
  "srt",
  "vtt",
  "whisper",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
audio-censor = "audio_censor.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/audio-censor-cli"
Documentation = "https://github.com/YusufBeratZengin/audio-censor-cli#readme"
Issues = "https://github.com/YusufBeratZengin/audio-censor-cli/issues"
Changelog = "https://github.com/YusufBeratZengin/audio-censor-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["audio_censor"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# Turkish text needs "İ", "ı", "ş", ... which RUF001-003 flag as ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["audio_censor"]
strict = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the package importable without an editable install, so `pytest` works
# whether it is started as `python -m pytest` or as a standalone script bound
# to another interpreter (the latter does not put the CWD on sys.path).
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["audio_censor"]
omit = ["audio_censor/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
